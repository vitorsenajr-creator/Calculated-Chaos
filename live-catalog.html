<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Catalog — Calculated Chaos</title>
  <meta name="theme-color" content="#2B241E" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    /* ---------- LIVE CATALOG (added 2026-08-10) ----------
       Deliberately its own page, not a tab inside the main app's SPA —
       it's a separate, unrelated workflow (fast capture during a live
       sale) that doesn't touch the real items collection at all. Still
       behind the same Firebase login, and reuses style.css's tokens so
       it looks like part of the same app. */
    body{ padding-bottom:40px; }
    .lc-header{
      padding:20px 22px 16px; background:linear-gradient(180deg, var(--blush) 0%, var(--cream) 100%);
      border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .lc-header h1{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:24px; margin:0; color:var(--plum); }
    .lc-header .lc-sub{ font-size:12.5px; color:var(--plum-soft); margin-top:2px; }
    .lc-back{ font-size:12.5px; font-weight:600; color:var(--terracotta-deep); cursor:pointer; text-decoration:underline; }
    main.lc-main{ max-width:1000px; margin:0 auto; padding:20px 22px 60px; }

    /* Session picker */
    .lc-session-card{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
    }
    .lc-session-card .name{ font-weight:600; color:var(--plum); font-size:14px; }
    .lc-session-card .meta{ font-size:11.5px; color:var(--plum-soft); margin-top:2px; }
    .lc-new-session-box{
      background:var(--white); border:1px dashed var(--blush); border-radius:14px; padding:16px; margin-top:16px;
    }
    .lc-new-session-box .field-row{ margin-bottom:10px; }

    /* Quick-add form */
    .lc-form{
      background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:20px;
      box-shadow:0 2px 10px rgba(61,44,50,0.05);
    }
    .lc-form-grid{ display:grid; grid-template-columns:90px 1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
    .lc-form-grid .field{ margin-bottom:0; }
    .lc-measure-row{ display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
    .lc-measure-row input{ padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
    .lc-measure-row .rm-btn{ background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:16px; padding:4px 8px; }
    .lc-add-measure-btn{
      background:transparent; border:1px dashed var(--line); border-radius:8px; padding:8px; width:100%;
      font-size:12.5px; color:var(--plum-soft); cursor:pointer; margin-bottom:14px;
    }
    #lcAddItemBtn{
      background:var(--terracotta); color:white; border:none; border-radius:10px;
      padding:13px; font-size:14px; font-weight:700; cursor:pointer; width:100%;
    }
    #lcAddItemBtn:active{ background:var(--terracotta-deep); }

    /* Table */
    .lc-table-wrap{ overflow-x:auto; background:var(--white); border:1px solid var(--line); border-radius:16px; }
    table.lc-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
    table.lc-table th{
      text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--plum-soft);
      padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
    }
    table.lc-table td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    table.lc-table tr:last-child td{ border-bottom:none; }
    table.lc-table input, table.lc-table select{
      border:1px solid transparent; background:transparent; font-size:13px; padding:5px 6px; border-radius:6px; width:100%; font-family:inherit;
    }
    table.lc-table input:hover, table.lc-table input:focus, table.lc-table select:hover, table.lc-table select:focus{
      border-color:var(--line); background:var(--cream-soft); outline:none;
    }
    .lc-num-cell input{ font-family:'JetBrains Mono',monospace; font-weight:700; width:56px; }
    .lc-measure-cell{ font-size:11.5px; color:var(--plum-soft); max-width:220px; }
    .lc-del-btn{ background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:15px; }
    .lc-empty{ text-align:center; padding:30px; color:var(--plum-soft); font-size:13px; }

    /* Sold toggle + sale details (added 2026-08-10) */
    .lc-sold-btn{
      border:1px solid var(--line); background:var(--cream-soft); color:var(--plum-soft);
      font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;
    }
    .lc-sold-btn.is-sold{ background:var(--terracotta); color:white; border-color:var(--terracotta); }
    .lc-sale-cell{ min-width:190px; }
    .lc-sale-fields{ display:flex; flex-direction:column; gap:4px; }
    .lc-sale-fields input, .lc-sale-fields textarea{
      border:1px solid var(--line); background:var(--white); font-size:12px; padding:5px 7px; border-radius:6px; width:100%; font-family:inherit;
    }
    .lc-sale-fields textarea{ resize:vertical; min-height:32px; }
    .lc-sale-fields .lbl{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--plum-soft); font-weight:700; }
    .lc-sale-empty{ font-size:11.5px; color:var(--plum-soft); }
  </style>
</head>
<body class="auth-locked">

<div id="authOverlay" style="display:flex;">
  <div class="auth-card">
    <h2>Live Catalog</h2>
    <p class="auth-sub">Sign in with your Calculated Chaos account.</p>
    <form id="authForm">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" autocomplete="username" required>
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" autocomplete="current-password" required minlength="6">
      <button type="submit" class="auth-submit" id="authSubmitBtn">Sign in</button>
    </form>
    <div class="auth-error" id="authError" style="display:none;"></div>
  </div>
</div>

<div class="lc-header">
  <div>
    <h1>🔴 Live Catalog</h1>
    <div class="lc-sub" id="lcHeaderSub">Fast item capture during a live sale — not part of the main inventory.</div>
  </div>
  <a href="/" style="font-size:12.5px; font-weight:600; color:var(--terracotta-deep); text-decoration:underline;">← Back to Calculated Chaos</a>
</div>

<main class="lc-main">
  <!-- SESSION PICKER -->
  <div id="sessionPickerView">
    <div id="sessionListArea"><div class="loading">Loading live sessions…</div></div>
    <div class="lc-new-session-box">
      <div style="font-weight:600; font-size:13px; color:var(--plum); margin-bottom:10px;">Start a new live</div>
      <div class="field-row">
        <div class="field"><label>Name</label><input type="text" id="lcNewSessionName" placeholder="e.g. Poshmark Live 8/10"></div>
        <div class="field"><label>Platform</label><select id="lcNewSessionPlatform"></select></div>
        <div class="field"><label>Date (defaults to today)</label><input type="date" id="lcNewSessionDate"></div>
        <div class="field"><label>Starting #</label><input type="number" id="lcNewSessionStart" value="1" min="1" style="width:100%;"></div>
      </div>
      <button id="lcCreateSessionBtn" class="settings-save-btn" style="margin-top:0;">Start live</button>
    </div>
  </div>

  <!-- LIVE ENTRY -->
  <div id="liveEntryView" style="display:none;">
    <div class="lc-back" id="lcBackToSessions">← All lives</div>
    <div style="margin:10px 0 18px;">
      <div style="font-family:'Fraunces',serif; font-style:italic; font-size:20px; color:var(--plum);" id="lcSessionTitle"></div>
      <div class="lc-sub" id="lcSessionMeta" style="font-size:12px; color:var(--plum-soft);"></div>
    </div>

    <div class="lc-form">
      <div class="lc-form-grid">
        <div class="field"><label># Live</label><input type="number" id="lcNum" min="1"></div>
        <div class="field">
          <label>Tipo</label>
          <input type="text" id="lcTipo" list="lcTipoOptions" placeholder="e.g. Sweater" autocomplete="off">
          <datalist id="lcTipoOptions"></datalist>
        </div>
        <div class="field">
          <label>Brand</label>
          <input type="text" id="lcBrand" list="lcBrandOptions" placeholder="e.g. Levi's" autocomplete="off">
          <datalist id="lcBrandOptions"></datalist>
        </div>
        <div class="field">
          <label>Size</label>
          <input type="text" id="lcSize" list="lcSizeOptions" placeholder="e.g. M" autocomplete="off">
          <datalist id="lcSizeOptions"></datalist>
        </div>
      </div>

      <label style="display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--plum-soft); margin-bottom:7px;">Measurements</label>
      <div id="lcMeasureRows"></div>
      <button type="button" class="lc-add-measure-btn" id="lcAddMeasureRowBtn">+ Add measurement</button>

      <button type="button" id="lcAddItemBtn">✓ Add item</button>
    </div>

    <div class="lc-table-wrap">
      <table class="lc-table" id="lcTable">
        <thead>
          <tr><th>#</th><th>Tipo</th><th>Brand</th><th>Size</th><th>Measurements</th><th>Sold?</th><th>Sale info</th><th></th></tr>
        </thead>
        <tbody id="lcTableBody"></tbody>
      </table>
    </div>
  </div>

  <datalist id="lcMeasureLabelOptions"></datalist>
</main>

<script type="module" src="/src/live-catalog.js"></script>
</body>
</html>
