<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Panel — Calculated Chaos</title>
  <meta name="theme-color" content="#12285A" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    /* ---------- DEVELOPER PANEL (v3.15.0; layout v3.24.8) ----------
       Platform-admin page, separate from the main app. Only platform admins
       (the platformAdmin claim) get past the gate in src/admin.js, and the
       Firestore rules enforce the same thing server-side.

       The theme is the business's Appearance setting (src/admin.js), so
       every color, radius and font here comes from the theme's tokens in
       style.css. The type scale is fixed (rem-like steps, not fluid), and
       the page is a header, a tab line and flat sections: no cards inside
       cards. */
    body{ padding-bottom:40px; font-size:14px; }

    /* Header: title and sign-in on the left, the way back on the right. */
    .ad-header{
      padding:16px 22px; background:var(--surface); color:var(--ink);
      border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .ad-header h1{ font-family:var(--font-ui); font-weight:700; font-size:20px; line-height:1.2; margin:0; color:var(--ink); }
    .ad-header .ad-sub{ font-size:12px; color:var(--ink-2); margin-top:2px; }
    .ad-back{ font-size:13px; font-weight:600; color:var(--brand-2); text-decoration:underline; text-underline-offset:3px; }

    /* Tabs: a line with an indicator under the open tab. One row, scrolled
       sideways when the phone is narrow. */
    .ad-tabs{
      display:flex; gap:22px; max-width:1040px; margin:0 auto; padding:0 22px;
      border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin;
    }
    .ad-tab{
      background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
      padding:12px 0; min-height:44px; font-size:14px; font-weight:600; color:var(--ink-2);
      cursor:pointer; white-space:nowrap; font-family:inherit;
    }
    .ad-tab:hover{ color:var(--ink); }
    .ad-tab.active{ color:var(--ink); border-bottom-color:var(--brand); }
    .ad-tab:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; }
    .ad-tab .ad-badge{
      display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px;
      background:var(--urgent); color:var(--urgent-on-brand); font-size:11px; line-height:18px; text-align:center;
    }

    main.ad-main{ max-width:1040px; margin:0 auto; padding:4px 22px 60px; }

    /* Sections are flat blocks separated by a rule, not boxes. */
    .ad-card{ padding:20px 0; border-top:1px solid var(--line); }
    main.ad-main section > .ad-card:first-child{ border-top:0; padding-top:16px; }
    .ad-card .ad-card{ padding:0; border:0; }
    .ad-card h3{ margin:0 0 4px; font-size:16px; line-height:1.3; font-weight:700; color:var(--ink); }
    .ad-desc{ font-size:13px; line-height:1.5; color:var(--ink-2); margin:0 0 12px; }
    .ad-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      padding:12px 0; border-bottom:1px solid var(--line-soft);
    }
    .ad-row:last-child{ border-bottom:none; }
    .ad-row .ad-main-text{ font-size:14px; color:var(--ink); font-weight:600; word-break:break-word; }
    .ad-meta{ font-size:12px; line-height:1.4; color:var(--ink-2); margin-top:2px; }
    .ad-row .ad-meta{ margin-top:2px; }
    .ad-actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .ad-btn{
      background:var(--brand); color:var(--on-brand); border:1px solid var(--brand); border-radius:var(--radius-sm);
      padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; min-height:40px; font-family:inherit;
    }
    .ad-btn.secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
    .ad-btn.danger{ background:transparent; color:var(--urgent); border-color:var(--urgent); }
    .ad-btn:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; }
    .ad-btn:disabled{ opacity:0.5; cursor:default; }
    .ad-pill{
      display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px;
      margin-left:6px; vertical-align:middle; background:var(--surface-2); color:var(--ink-2);
    }
    .ad-pill.approved{ color:var(--ok); }
    .ad-pill.pending{ background:var(--warn-bg); color:var(--warn-ink); }
    .ad-pill.employee{ color:var(--ink-2); }
    .ad-pill.unknown{ color:var(--urgent); }
    .ad-kv{ display:grid; grid-template-columns:max-content 1fr; gap:8px 16px; font-size:14px; }
    .ad-kv dt{ color:var(--ink-2); }
    .ad-kv dd{ margin:0; color:var(--ink); word-break:break-word; }
    .ad-err-msg{ font-size:13px; color:var(--ink); margin-top:4px; white-space:pre-wrap; word-break:break-word; }
    .ad-empty{ font-size:13px; color:var(--ink-2); }
    .ad-links a{ display:block; font-size:14px; color:var(--brand-2); padding:6px 0; }
    .ad-denied{ max-width:420px; margin:60px auto; text-align:center; color:var(--ink); }

    /* AI usage meter (v3.24.5): totals on hairline cells, then a table. */
    .ad-totals{
      display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1px;
      background:var(--line); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin:8px 0 16px;
    }
    .ad-total{ background:var(--surface); padding:12px 14px; }
    .ad-total .ad-total-label{ font-size:12px; color:var(--ink-2); }
    .ad-total .ad-total-value{ font-size:22px; line-height:1.2; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
    /* Parcel sets its figures condensed, like its shipping labels. */
    html:not([data-theme]) .ad-total-value,
    html:not([data-theme]) .ad-table .num{ font-stretch:85%; }
    .ad-table-wrap{ overflow-x:auto; }
    .ad-table{ width:100%; border-collapse:collapse; font-size:14px; }
    .ad-table th, .ad-table td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
    .ad-table th{ font-size:12px; color:var(--ink-2); font-weight:600; white-space:nowrap; }
    .ad-table td{ word-break:break-word; }
    .ad-table .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .ad-table th:first-child, .ad-table td:first-child{ position:sticky; left:0; background:var(--bg); }
    .ad-table td:first-child{ min-width:220px; word-break:normal; }
    input[type="month"]{ min-height:40px; font:inherit; }

    @media (max-width:640px){
      .ad-header{ padding:14px 16px; }
      .ad-tabs{ padding:0 16px; gap:18px; }
      main.ad-main{ padding:4px 16px 48px; }
      .ad-tab, .ad-btn{ min-height:44px; }
      .ad-actions .ad-btn{ flex:1 1 auto; }
      .ad-totals{ grid-template-columns:repeat(2, 1fr); }
      .ad-totals > :last-child:nth-child(odd){ grid-column:1 / -1; }
    }
  </style>
</head>
<body class="auth-locked">

<div id="authOverlay" style="display:flex;">
  <div class="auth-card">
    <div id="authCheckingState" class="ad-empty" style="text-align:center; padding:20px 0;">Checking your session…</div>
    <div id="authFormState" style="display:none;">
    <h2>Developer Panel</h2>
    <p class="auth-sub">Sign in with an admin account.</p>
    <form id="authForm">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" autocomplete="username" required>
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" autocomplete="current-password" required minlength="6">
      <button type="submit" class="auth-submit" id="authSubmitBtn">Sign in</button>
    </form>
    <div class="auth-error" id="authError" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="ad-header">
  <div>
    <h1>Developer Panel</h1>
    <div class="ad-sub" id="adHeaderSub">Platform administration</div>
  </div>
  <a href="/" class="ad-back">Back to the app</a>
</div>

<div id="adDenied" class="ad-denied" style="display:none;">
  <h2>Admins only</h2>
  <p class="ad-empty" style="font-size:14px;">This page is for the platform admin. You're signed in as <b id="adDeniedEmail"></b>.</p>
  <p><a href="/" class="ad-back">Back to the app</a></p>
</div>

<nav class="ad-tabs" id="adTabs" style="display:none;">
  <button class="ad-tab active" data-tab="approvals">Approvals <span class="ad-badge" id="adPendingBadge" style="display:none;"></span></button>
  <button class="ad-tab" data-tab="users">Users</button>
  <button class="ad-tab" data-tab="ebay">eBay</button>
  <button class="ad-tab" data-tab="errors">eBay errors</button>
  <button class="ad-tab" data-tab="ai">AI usage</button>
  <button class="ad-tab" data-tab="backup">Backup</button>
  <button class="ad-tab" data-tab="app">App</button>
</nav>

<main class="ad-main" id="adMain" style="display:none;">
  <section data-panel="approvals" id="panelApprovals"></section>
  <section data-panel="users" id="panelUsers" style="display:none;"></section>
  <section data-panel="ebay" id="panelEbay" style="display:none;"></section>
  <section data-panel="errors" id="panelErrors" style="display:none;"></section>
  <section data-panel="ai" id="panelAi" style="display:none;"></section>
  <section data-panel="backup" id="panelBackup" style="display:none;"></section>
  <section data-panel="app" id="panelApp" style="display:none;"></section>
</main>

<script type="module" src="/src/admin.js"></script>
</body>
</html>
